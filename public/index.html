<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Streaming</title>
  </head>
  <body>
    <select id="sel"></select>
    <video id="v" controls width="800"></video>
    <script>
      fetch("/api/videos")
        .then((r) => r.json())
        .then((list) => {
          sel.innerHTML = list.map((f) => `<option>${f}</option>`).join("");
        });
      sel.onchange = async () => {
        const r = await fetch("/api/stream/" + encodeURIComponent(sel.value));
        const { url } = await r.json();
        v.src = url;
        v.play();
      };
    </script>
  </body>
</html>
